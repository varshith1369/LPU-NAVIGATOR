name: Project checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run data:validate
      - run: npm test
      - run: npm run build
      - run: node scripts/smoke-ui.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r ai-service/requirements.txt httpx
      - run: python -m unittest discover -s ai-service -p 'test_*.py'
      - run: python -m unittest discover -s ml-service -p 'test_*.py'
