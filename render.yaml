services:
  - type: web
    name: lpu-campus-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    preDeployCommand: node scripts/setup-db.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: APP_ORIGIN
        sync: false
      - key: JWT_SECRET
        generateValue: true
